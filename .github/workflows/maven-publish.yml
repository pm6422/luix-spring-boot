name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
          server-id: sonatype-central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      - name: Resolve release version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign, and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn --version
          mvn clean deploy -Prelease -Drevision="${{ steps.ver.outputs.version }}" -B

      - name: Notify ntfy on Success
        if: success()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [[ -z "$NTFY_URL" ]]; then
            echo "NTFY_URL secret is not set; skipping ntfy notification."
            exit 0
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          DURATION="$(( ($(date +%s) - START_TIME) / 60 ))m $(( ($(date +%s) - START_TIME) % 60 ))s"
          curl -fsS \
            -H "Title: luix-spring-boot v${VERSION} Published" \
            -H "Priority: default" \
            -H "Tags: package,green_circle" \
            -H "Actions: view, Maven Central, https://central.sonatype.com/artifact/com.luixtech/luix-spring-boot-starter/${VERSION}" \
            --data-binary @- "$NTFY_URL" <<EOF
          Artifacts: com.luixtech:luix-core & luix-spring-boot-starter (${VERSION})
          Auto-publish to Maven Central triggered.
          Duration: ${DURATION}
          EOF

      - name: Notify ntfy on Failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [[ -z "$NTFY_URL" ]]; then
            echo "NTFY_URL secret is not set; skipping ntfy notification."
            exit 0
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          DURATION="$(( ($(date +%s) - START_TIME) / 60 ))m $(( ($(date +%s) - START_TIME) % 60 ))s"
          curl -fsS \
            -H "Title: luix-spring-boot Publish Failed" \
            -H "Priority: high" \
            -H "Tags: red_circle" \
            -H "Actions: view, View Logs, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-binary @- "$NTFY_URL" <<EOF
          Release ${VERSION:-unknown} failed to publish to Maven Central.
          Duration: ${DURATION}
          Check GitHub Actions logs for details.
          EOF
